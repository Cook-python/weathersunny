name: Sync Scratch data

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      user:
        description: Scratch username
        required: false
        default: weather_sunny

permissions:
  contents: write

concurrency:
  group: sync-scratch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch projects and profile
        env:
          SCRATCH_USER: ${{ inputs.user || 'weather_sunny' }}
        run: python3 tools/sync_scratch.py

      - name: Commit when data changed
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "sync scratch data ($(date -u +%Y-%m-%d))"
          git push
