[build]
  publish = "."
  command = "python3 tools/sync_scratch.py --soft-fail"

[build.environment]
  PYTHON_VERSION = "3.12"
  SCRATCH_USER = "weather_sunny"
  SCRATCH_OUT = "data"

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/introduction"
  to = "/introduction/index.html"
  status = 200

[[redirects]]
  from = "/my-project"
  to = "/my-project/index.html"
  status = 200

[[redirects]]
  from = "/articles"
  to = "/articles/index.html"
  status = 200

[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
